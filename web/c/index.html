<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Agora — Invitación a comunidad</title>
  <style>
    :root {
      --bg: #f6f3ec;
      --card: #fffdf8;
      --primary: #5b3a29;
      --accent: #9c6b3f;
      --text: #2b2622;
      --muted: #7a726a;
      --border: #e3dccd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(91, 58, 41, 0.08);
      text-align: center;
    }
    .intro { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
    h1 { color: var(--primary); font-size: 22px; margin: 0 0 12px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; }
    .code {
      display: inline-block;
      margin: 12px 0;
      padding: 10px 18px;
      border: 1px dashed var(--accent);
      border-radius: 10px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--primary);
      user-select: all;
    }
    button, .btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <div class="card" id="root">
    <p class="intro">Agora</p>
    <h1>Te han invitado a una comunidad</h1>
    <div id="content"></div>
  </div>

  <script>

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    function getCode() {
      const m = location.pathname.match(/\/c\/([^/?#]+)/);
      if (m && m[1] !== "index.html") return decodeURIComponent(m[1]);
      return new URLSearchParams(location.search).get("code");
    }

    const content = document.getElementById("content");
    const code = getCode();

    if (!code) {
      content.innerHTML = `<p>Este enlace no es correcto.</p>`;
    } else {
      content.innerHTML = `
        <p>Ábrela en el navegador y únete con este código:</p>
        <div class="code">${esc(code)}</div>
        <a class="btn" id="openWeb" href="/app/?c=${encodeURIComponent(code)}">Abrir en el navegador</a>
        <button class="secondary" id="openApp">Abrir en la app</button>
        <button class="secondary" disabled>Google Play &middot; próximamente</button>
        <button class="secondary" disabled>App Store &middot; próximamente</button>`;

      // "Abrir en el navegador" (principal, sobre todo para iOS): la web app pide
      // login/registro y auto-une a la comunidad con el código (App.kt lo resuelve
      // vía AutoJoinByInviteScreen). Es un <a> con href real para que funcione
      // aunque el JS falle y sea enlazable/compartible.
      // "Abrir en la app": plan B vía custom scheme para quien tenga la app nativa
      // y acabe en el navegador (en Android el App Link ya la abre directamente).
      document.getElementById("openApp").onclick = () => {
        location.href = "agora://invite/" + encodeURIComponent(code);
      };
    }
  </script>
</body>
</html>
