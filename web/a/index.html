<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Agora — Invitación a actividad</title>
  <style>
    :root {
      --bg: #f6f3ec;
      --card: #fffdf8;
      --primary: #5b3a29;
      --accent: #9c6b3f;
      --text: #2b2622;
      --muted: #7a726a;
      --error: #b3261e;
      --border: #e3dccd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(91, 58, 41, 0.08);
    }
    .intro { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
    h1 { color: var(--primary); font-size: 22px; margin: 0 0 16px; }
    .row { font-size: 15px; margin: 6px 0; }
    .muted { color: var(--muted); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { color: var(--error); font-size: 13px; margin-top: 8px; }
    .status-title { color: var(--primary); font-size: 20px; margin: 0 0 8px; }
    .hidden { display: none; }
    .center { text-align: center; }
    .positions { margin-top: 14px; }
    .positions-label { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
    .pos-option { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
    .pos-option input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }
    .pos-option label { display: inline; margin: 0; font-size: 15px; color: var(--text); cursor: pointer; }
    .pos-option label.disabled { color: var(--muted); cursor: default; }
    .pos-avail { font-size: 12px; color: var(--muted); margin-left: 4px; }
  </style>
</head>
<body>
  <div class="card" id="root">
    <p class="intro" id="loading">Cargando…</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ckuwetftnkhbndolcnjw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrdXdldGZ0bmtoYm5kb2xjbmp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1ODE0MzIsImV4cCI6MjA5MTE1NzQzMn0.xMzdqqfoanGUE7GG1OZp0F4jGAaj0O1v4Oajq5lJKIs";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true },
    });

    const root = document.getElementById("root");

    function getCode() {
      const m = location.pathname.match(/\/a\/([^/?#]+)/);
      if (m) return decodeURIComponent(m[1]);
      const q = new URLSearchParams(location.search).get("code");
      return q || null;
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    function fmtDate(iso) {
      try {
        const d = new Date(iso);
        const p = (n) => String(n).padStart(2, "0");
        return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
      } catch (e) { return iso; }
    }

    // 650 -> "6,50 €". Mismo formato que formatEuros (Money.kt) a mano: toLocaleString
    // depende del locale del navegador y aquí el importe se enseña siempre en euros.
    function fmtEuros(cents) {
      return `${Math.trunc(cents / 100)},${String(cents % 100).padStart(2, "0")} €`;
    }

    const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=app.shareagora.community";

    function renderMessage(title, message) {
      root.innerHTML = `
        <h2 class="status-title">${esc(title)}</h2>
        <p class="muted">${esc(message)}</p>`;
    }

    function renderStatus(code, title, message) {
      // Pantallas de estado (ya eres miembro / solicitud enviada/aprobada): antes
      // solo ofrecían stores, dejando tirado a iOS. Ahora "Abrir en el navegador"
      // lleva a la web app (App.kt resuelve ?a={code}). El formulario de invitado
      // (renderForm) se mantiene ligero y no toca esto.
      root.innerHTML = `
        <h2 class="status-title">${esc(title)}</h2>
        <p class="muted">${esc(message)}</p>
        <button id="openWeb">Abrir en el navegador</button>
        <button class="secondary" id="getPlay">Descargar en Google Play</button>`;
      document.getElementById("openWeb").onclick = () => {
        location.href = "/app/?a=" + encodeURIComponent(code);
      };
      document.getElementById("getPlay").onclick = () => { location.href = PLAY_STORE_URL; };
    }

    function renderForm(code, preview) {
      const a = preview.activity;
      const positions = preview.positions || [];
      const hasPositions = a.slot_mode === "limited_with_positions" && positions.length > 0;
      const capacity = (a.slot_mode === "unlimited" || a.capacity == null)
        ? "Plazas abiertas"
        : `Plazas: ${a.taken} / ${a.capacity}`;
      // El importe y el "cómo se paga" son dos cosas distintas: 6,50 € no dice a qué
      // número hacer el Bizum. Mismo criterio que el detalle de la actividad: los dos
      // juntos cuando existen, y la fila no se pinta si no hay ninguno.
      const cost = [
        a.price_cents == null ? null : fmtEuros(a.price_cents),
        a.cost_description || null,
      ].filter(Boolean).join(" · ");

      let positionsHtml = "";
      if (hasPositions) {
        const items = positions.map((p) => {
          const disabled = p.available === 0;
          const cls = disabled ? ' class="disabled"' : "";
          const disAttr = disabled ? " disabled" : "";
          const avail = p.available === 1 ? "1 libre" : `${p.available} libres`;
          return `<div class="pos-option">
            <input type="checkbox" id="pos-${esc(p.id)}" value="${esc(p.id)}"${disAttr} />
            <label for="pos-${esc(p.id)}"${cls}>${esc(p.name)}<span class="pos-avail">(${esc(avail)})</span></label>
          </div>`;
        }).join("");
        positionsHtml = `<div class="positions">
          <p class="positions-label">Posiciones disponibles</p>
          ${items}
        </div>`;
      }

      root.innerHTML = `
        <p class="intro">Te han invitado a esta actividad</p>
        <h1>${esc(a.name)}</h1>
        ${a.description ? `<div class="row">${esc(a.description)}</div>` : ""}
        <div class="row">Cuándo: ${esc(fmtDate(a.datetime))}</div>
        ${a.location_name ? `<div class="row">Dónde: ${esc(a.location_name)}</div>` : ""}
        ${cost ? `<div class="row">Coste: ${esc(cost)}</div>` : ""}
        <div class="row muted">${esc(capacity)}</div>
        <label for="name">Tu nombre</label>
        <input id="name" type="text" autocomplete="name" />
        <label for="email">Tu email</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" />
        ${positionsHtml}
        <div class="error hidden" id="err"></div>
        <button id="submit">Solicitar asistir</button>`;

      const submit = document.getElementById("submit");
      const err = document.getElementById("err");
      submit.onclick = async () => {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        if (!name || !email) {
          err.textContent = "Introduce tu nombre y tu email.";
          err.classList.remove("hidden");
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          err.textContent = "Introduce un email válido.";
          err.classList.remove("hidden");
          return;
        }
        let positionIds = null;
        if (hasPositions) {
          positionIds = positions
            .filter((p) => document.getElementById("pos-" + p.id)?.checked)
            .map((p) => p.id);
          if (positionIds.length === 0) {
            err.textContent = "Selecciona al menos una posición.";
            err.classList.remove("hidden");
            return;
          }
        }
        err.classList.add("hidden");
        submit.disabled = true;
        submit.textContent = "Enviando…";
        const params = { p_code: code, p_name: name, p_email: email };
        if (positionIds) params.p_position_ids = positionIds;
        const { data, error } = await client.rpc("request_guest_slot", params);
        if (error) {
          err.textContent = error.message || "No se pudo enviar la solicitud.";
          err.classList.remove("hidden");
          submit.disabled = false;
          submit.textContent = "Solicitar asistir";
          return;
        }
        applyResult(code, data, a.name);
      };
    }

    function applyResult(code, result, activityName) {
      const status = result && result.status;
      if (status === "pending") {
        renderStatus(code, "Solicitud enviada",
          `Tu solicitud para asistir a ${activityName} está pendiente de que la apruebe un administrador.`);
      } else if (status === "approved") {
        renderStatus(code, "¡Estás dentro!", `Tu asistencia a ${activityName} ha sido aprobada.`);
      } else if (status === "full") {
        renderMessage("Sin plazas", "Esta actividad no tiene plazas disponibles ahora mismo.");
      } else if (status === "already_member") {
        renderStatus(code, "Ya eres miembro", "Ábrela para ver la actividad.");
      } else {
        renderStatus(code, "Solicitud enviada", `Tu solicitud para asistir a ${activityName} está pendiente de aprobación.`);
      }
    }

    /**
     * ¿Hay sesión de la web app? La app (supabase-kt) guarda la sesión en
     * localStorage con su propia clave (sb-<url>-session), distinta de la que
     * usa supabase-js aquí (sb-<ref>-auth-token), así que este cliente no la ve
     * y trataría como invitado a alguien que ya tiene cuenta. Se detecta por
     * patrón para no depender del formato exacto de la clave.
     */
    function hasAppSession() {
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("sb-") && k.endsWith("-session")) return true;
        }
      } catch (e) { /* localStorage bloqueado: seguir como invitado */ }
      return false;
    }

    async function main() {
      const code = getCode();
      if (!code) { renderMessage("Enlace no válido", "Este enlace no es correcto."); return; }

      // Usuario con cuenta: que abra la actividad con su identidad real en la
      // app, en vez del flujo de invitado anónimo.
      if (hasAppSession()) {
        location.replace("/app/?a=" + encodeURIComponent(code));
        return;
      }

      const { data: sessionData } = await client.auth.getSession();
      if (!sessionData.session) {
        const { error } = await client.auth.signInAnonymously();
        if (error) { renderMessage("Error", "No se pudo iniciar la sesión de invitado."); return; }
      }

      const { data: preview, error } = await client.rpc("get_activity_guest_preview", { p_code: code });
      if (error) { renderMessage("Error", error.message || "No se pudo cargar la actividad."); return; }

      if (!preview || preview.status !== "ok") {
        renderMessage("Enlace no válido", "Esta actividad ya no está disponible.");
        return;
      }
      if (preview.is_member) {
        renderStatus(code, "Ya eres miembro", "Ábrela para ver la actividad.");
        return;
      }
      const req = preview.my_request;
      const activityName = preview.activity.name;
      if (req && req.status === "pending") {
        renderStatus(code, "Solicitud enviada",
          `Tu solicitud para asistir a ${activityName} está pendiente de que la apruebe un administrador.`);
      } else if (req && req.status === "approved") {
        renderStatus(code, "¡Estás dentro!", `Tu asistencia a ${activityName} ha sido aprobada.`);
      } else if (req && req.status === "rejected") {
        renderStatus(code, "Solicitud no aprobada", `Tu solicitud para asistir a ${activityName} no fue aprobada.`);
      } else {
        renderForm(code, preview);
      }
    }

    main().catch((e) => renderMessage("Error", String(e)));
  </script>
</body>
</html>
