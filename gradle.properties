org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
# El compile de producción wasm (compileProductionExecutableKotlinWasmJs, con
# optimización binaryen) necesita más memoria que Android; 2048M provocaba OOM.
kotlin.daemon.jvmargs=-Xmx4096M
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.configuration-cache=true
# Suppress "target disabled on this machine" warning when building Android on Windows
kotlin.native.ignoreDisabledTargets=true
